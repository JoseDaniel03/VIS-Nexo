[package]
name = "vslauncher-tauri"
version = "2.19.0"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
argon2 = "0.5"
rand_core = { version = "0.6", features = ["getrandom"] }
base64 = "0.22"
vsui-core = { path = "../legacy/crates/vsui-core" }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
sha1 = "0.10"
rayon = "1.10"
zip = { version = "0.6", default-features = false, features = ["deflate"] }
uuid = "1"
urlencoding = "2.1"
md5 = "0.7"

# Updates are enabled only with a release signing public key and HTTPS feed.
tauri-plugin-updater = "2"
sha2 = "0.10"
flate2 = "1"
tar = "0.4"
url = "2"

# Verify upstream Horizon Nightly signatures against its pinned Ed25519 release key.
ed25519-dalek = "2.2"
