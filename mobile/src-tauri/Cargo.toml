[package]
name = "vis-nexo-android"
version = "0.4.0"
edition = "2021"
publish = false

[workspace]

[lib]
name = "vis_nexo_android_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Keep mobile debug signing, but omit large Rust DWARF sections.
[profile.dev]
debug = 0
strip = "debuginfo"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
argon2 = "0.5"
base64 = "0.22"
rand_core = { version = "0.6", features = ["getrandom"] }
ed25519-dalek = "2.2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
