<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#120a28" />
  <title>VIS Nexo</title>
  <link rel="stylesheet" href="./styles.css" />
  <link rel="stylesheet" href="./visual-v2.1.css" />
  <link rel="stylesheet" href="./motion-v2.2.css" />
  <link rel="stylesheet" href="./project-v2.3.css" />
  <link rel="stylesheet" href="./minecraft-v2.4.css" />
  <link rel="stylesheet" href="./vslauncher-v2.5.css" />
  <link rel="stylesheet" href="./vslauncher-v2.6.css" />
  <link rel="stylesheet" href="./vis-nexo-v2.7.css" />
  <link rel="stylesheet" href="./vis-nexo-v2.8.css" />
  <link rel="stylesheet" href="./vis-nexo-v2.9.css"/>
<link rel="stylesheet" href="./vis-nexo-v2.10.css" />
  <link rel="stylesheet" href="./vis-nexo-v2.12.css" />
  <script type="module" src="./splash.js"></script>
  <script type="module" src="./app.js"></script>
<link rel="stylesheet" href="./vis-nexo-v2.13.css"/>
<link rel="stylesheet" href="./vis-nexo-v2.14.css"/>
<link rel="stylesheet" href="./vis-nexo-v2.15.css"/>
<link rel="stylesheet" href="./vis-nexo-v2.16.css"/>
<link rel="stylesheet" href="./vis-nexo-v2.17.css"/>
<link rel="stylesheet" href="./vis-nexo-v2.20.css"/>
<link rel="stylesheet" href="./vis-nexo-v2.21.css"/>
<link rel="stylesheet" href="./splash.css" />
<link rel="stylesheet" href="./loading.css" />
</head>
<body>
  <div id="vis-startup" class="vis-startup" role="status" aria-live="polite">
    <div class="vis-startup__shade" aria-hidden="true"></div>
    <div class="vis-startup__identity">
      <div class="vis-startup__mark"><img src="./assets/vis-nexo-mark.svg" alt="" /></div>
      <h1>VSNEXO</h1>
      <p class="vis-startup__tagline">MÁS QUE UN <strong>LAUNCHER</strong></p>
    </div>
    <div class="vis-startup__footer">
      <div class="vis-startup__meta">
        <span id="vis-startup-stage">Inicializando VIS Nexo</span><small>cargando</small>
      </div>
      <div class="vis-startup__track" role="progressbar" aria-label="Progreso de inicialización"><span class="vis-startup__bar"></span></div>
      <div id="vis-startup-recovery" class="vis-startup__recovery" hidden>La aplicación todavía no respondió.
        <button class="vis-startup__retry" type="button" data-vis-retry>Reintentar inicio</button>
      </div>
    </div>
  </div>
  <div id="app"><div class="boot">VIS Nexo<span class="boot-dot"></span></div></div>
  <div id="toast-region" role="status" aria-live="polite"></div>
</body>
</html>
