name: VIS Nexo - Project Security CI
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/vis-project-security-check.yml'
      - 'legacy/crates/vsui-core/**'
      - 'src-tauri/src/main.rs'
      - 'src-tauri/src/social.rs'
      - 'types/vis-commands.ts'
      - 'src-tauri/src/project_guard.rs'
      - 'src-tauri/src/team_pack.rs'
      - 'web/app.js'
      - 'src-tauri/src/cloud.rs'
      - 'services/universe/worker.mjs'
      - 'tools/test_universe_worker.mjs'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: vis-project-security-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Linux Tauri build requirements
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf libasound2-dev libudev-dev
      - name: Frontend and bridge contracts
        run: |
          npm ci
          npm run validate
          npm run check:release
      - name: Rust project policy and packaging tests
        run: |
          cargo check -p vslauncher-tauri --all-targets --locked
          cargo test --workspace --bins --lib --locked
