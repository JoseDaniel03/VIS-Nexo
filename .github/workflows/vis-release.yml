# SECURITY HOLD: Legacy release pipeline bundled installers and read an updater signing key.
# It must not publish software while VIS Nexo commits to portable-only distribution.
# Replace with reviewed, protected-environment portable EXE/AppImage signing workflow.
name: VIS Nexo - Legacy installer pipeline disabled
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release-disabled:
    runs-on: ubuntu-24.04
    steps:
      - name: Explain safety hold
        run: |
          echo 'Legacy installer releases are disabled for VIS Nexo security.'
          echo 'Use the manual unsigned build only for local testing.'
          echo 'Release must wait for a SignPath-approved signed portable channel.'
