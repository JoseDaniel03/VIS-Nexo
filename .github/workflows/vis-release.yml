# VIS Nexo portable public releases: no NSIS/MSI/DEB and no Tauri updater installer.
name: VIS Nexo - Publicar versiones portables
on:
  push:
    tags:
      - 'nexo-v*'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    name: VIS Nexo ${{ matrix.platform }}
    if: startsWith(github.ref, 'refs/tags/nexo-v')
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runner: ubuntu-24.04
            bundles: appimage
          - platform: windows
            runner: windows-2022
            bundles: portable
    env:
      PYTHONUTF8: "1"
      # Strip Rust symbols from launcher and official-source Horizon release binaries.
      CARGO_PROFILE_RELEASE_STRIP: symbols
      VIS_CATALOG_URL: ${{ vars.VIS_CATALOG_URL }}
      VIS_SOCIAL_URL: ${{ vars.VIS_SOCIAL_URL }}
      # For identical signed Linux/Windows builds set a full upstream Git SHA.
      VIS_HORIZON_REF: ${{ vars.VIS_HORIZON_COMMIT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Linux native libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf libasound2-dev libudev-dev
      - run: npm ci
      - name: JavaScript and bridge verification
        run: |
          npm run validate
          npm run check:release
      - name: Portable download size-policy tests
        run: python tools/test_portable_size.py
      - name: Windows portable payload regression tests
        run: python tools/test_windows_portable.py
      - name: Linux portable payload and executable-permission tests
        if: runner.os == 'Linux'
        run: python tools/test_linux_portable.py
      - name: Verify Rust backend and tests
        run: |
          cargo check -p vslauncher-tauri --all-targets --locked
          cargo test --workspace --bins --lib --locked
      - name: Require a pinned upstream Horizon commit for public release
        shell: bash
        run: |
          [[ "$VIS_HORIZON_REF" =~ ^[0-9a-fA-F]{40}$ ]] || { echo 'Configure VIS_HORIZON_COMMIT (40 hex SHA) to ship the same game source on Windows/Linux'; exit 1; }
      - name: Build Minecraft Horizon GAME from the pinned official Rust sources
        run: npm run horizon:source
      - name: Verify official Rust Edition game source
        run: npm run horizon:verify
      - name: Separate optional Rust Edition engine and embed SHA-256 download manifest
        run: python tools/package_vis_rust_engine.py --release-tag ${{ github.ref_name }}
      - name: Build Linux AppImage only (no installer)
        if: runner.os == 'Linux'
        run: npm run build -- --bundles appimage --config src-tauri/tauri.unsigned.json
      - name: Package Linux launcher without game binaries
        if: runner.os == 'Linux'
        run: python tools/package_linux_portable.py --slim
      - name: Report Linux download size — goal 50 MB, maximum 150 MB
        if: runner.os == 'Linux'
        run: |
          python tools/check_portable_size.py target/release/portable-linux/VIS-Nexo-Linux-x86_64-Portable.tar.gz --strict
          python tools/check_portable_size.py target/release/bundle/appimage/*.AppImage --strict
      - name: Publish Linux portable TAR.GZ to GitHub Releases
        if: runner.os == 'Linux'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: VIS Nexo ${{ github.ref_name }}
          body: 'Windows ZIP (extraer y abrir VIS Nexo.exe) y Linux TAR.GZ con AppImage (extraer y ejecutar). Ninguno instala VIS Nexo. Los perfiles y mundos permanecen en los directorios de usuario. Actualizar reemplazando los archivos del launcher.'
          files: |
            target/release/portable-linux/VIS-Nexo-Linux-x86_64-Portable.tar.gz
            target/release/bundle/appimage/*.AppImage
            target/release/rust-engine/VIS-Rust-Edition-Linux-x86_64-Engine.tar.gz
          fail_on_unmatched_files: true
          overwrite_files: true
      - name: Build Windows portable (no setup, no NSIS)
        if: runner.os == 'Windows'
        run: npm run build -- --no-bundle --config src-tauri/tauri.unsigned.json
      - name: Package Windows with Horizon verified source
        if: runner.os == 'Windows'
        run: python tools/package_windows_portable.py --slim
      - name: Report Windows download size — goal 50 MB, maximum 150 MB
        if: runner.os == 'Windows'
        run: python tools/check_portable_size.py target/release/portable/VIS-Nexo-Windows-x64-Portable.zip --strict
      - name: Publish Windows portable ZIP on GitHub Releases
        if: runner.os == 'Windows'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: VIS Nexo ${{ github.ref_name }}
          files: |
            target/release/portable/VIS-Nexo-Windows-x64-Portable.zip
            target/release/rust-engine/VIS-Rust-Edition-Windows-x64-Engine.zip
          fail_on_unmatched_files: true
          overwrite_files: true
