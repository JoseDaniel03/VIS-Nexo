name: VIS Social - Provision First Super Administrator

on:
  workflow_dispatch:
    inputs:
      username:
        description: 'Existing VIS Social username to promote (no auto-created accounts)'
        required: true
        type: string
      public_key:
        description: 'Device Ed25519 public key from VIS Nexo (standard base64, NOT private key)'
        required: true
        type: string
      confirm:
        description: 'I verified the device key fingerprint and authorize first super-admin grant'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: vis-social-production
  cancel-in-progress: false

jobs:
  bootstrap:
    if: ${{ github.ref == 'refs/heads/main' && inputs.confirm == true }}
    runs-on: ubuntu-24.04
    environment: vis-social-production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
      VIS_SUPERADMIN_USERNAME: ${{ inputs.username }}
      VIS_SUPERADMIN_PUBLIC_KEY: ${{ inputs.public_key }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate guarded SQL with device public key
        run: python3 tools/prepare_social_superadmin.py
      - name: Grant first super-admin role only if no super-admin exists
        working-directory: services/social
        run: npx --yes wrangler@4 d1 execute DB --remote --file=.vis-superadmin-grant.sql
      - name: Confirm account public key and granted role
        working-directory: services/social
        run: |
          npx --yes wrangler@4 d1 execute DB --remote --file=.vis-superadmin-verify.sql --json > .vis-superadmin-result.json
          node --input-type=module -e "import fs from 'node:fs'; const d=JSON.parse(fs.readFileSync('.vis-superadmin-result.json','utf8')); const rows=Array.isArray(d)?d.flatMap(x=>x.results||[]):(d.results||[]); if(rows.length!==1||rows[0].role!=='super_admin'||rows[0].username!==process.env.VIS_SUPERADMIN_USERNAME.trim().toLowerCase()||rows[0].signing_public_key!==process.env.VIS_SUPERADMIN_PUBLIC_KEY.trim())process.exit(1);console.log('VIS Social first super admin granted to verified device key')"
      - name: Remove temporary SQL files
        if: always()
        run: rm -f services/social/.vis-superadmin-grant.sql services/social/.vis-superadmin-verify.sql services/social/.vis-superadmin-result.json
