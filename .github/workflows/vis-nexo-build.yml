name: VIS Nexo Native Build
concurrency:
  group: vis-nexo-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src-tauri/**'
      - 'web/**'
      - 'legacy/crates/vsui-core/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'package-lock.json'
      - 'package.json'
      - 'tools/**'
      - 'services/universe/**'
      - 'src-tauri/resources/horizon/README.txt'
      - '.github/workflows/vis-nexo-build.yml'
  pull_request:
    branches: [main, feature/project-modpacks-instance-controls]
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: linux-portable
            bundles: appimage
          - os: windows-2022
            name: windows-portable
            bundles: portable
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
      VIS_CATALOG_URL: ${{ vars.VIS_CATALOG_URL }}
      VIS_SOCIAL_URL: ${{ vars.VIS_SOCIAL_URL }}
      VIS_HORIZON_REF: 1405044d0996d37f850f5ab0dec02bab43d4945f
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf libasound2-dev libudev-dev
      - name: Install frontend build CLI
        run: npm ci
      - name: JavaScript and bridge verification
        run: |
          npm run validate
          npm run check:release
      - name: Portable payload regression tests (both platforms)
        run: |
          python tools/test_windows_portable.py
          python tools/test_linux_portable.py
      - name: Cargo check and Rust unit tests
        run: |
          cargo check -p vslauncher-tauri --all-targets --locked
          cargo test --workspace --bins --lib --locked
      - name: Build Minecraft Horizon GAME from official Rust sources
        run: npm run horizon:source
      - name: Verify bundled game's source manifest
        run: npm run horizon:verify
      - name: Build standalone Linux AppImage (no DEB or installer)
        if: runner.os == 'Linux'
        run: npm run build -- --bundles appimage --config src-tauri/tauri.unsigned.json
      - name: Audit AppImage and package Linux portable folder
        if: runner.os == 'Linux'
        run: python tools/package_linux_portable.py
      - name: Build Windows launcher (no installer)
        if: runner.os == 'Windows'
        run: npm run build -- --no-bundle --config src-tauri/tauri.unsigned.json
      - name: Package Windows portable ZIP
        if: runner.os == 'Windows'
        run: python tools/package_windows_portable.py
      - name: Upload Linux portable TAR.GZ (executable permissions preserved)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: vis-nexo-linux-portable
          path: target/release/portable-linux/VIS-Nexo-Linux-x86_64-Portable.tar.gz
          if-no-files-found: error
      - name: Upload Windows portable app (unzip and run VIS Nexo.exe)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: vis-nexo-windows-portable
          path: target/release/portable/app/**
          include-hidden-files: true
          if-no-files-found: error
