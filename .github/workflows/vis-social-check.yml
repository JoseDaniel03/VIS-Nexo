name: VIS Social - checks
on:
  pull_request:
    paths:
      - 'services/social/**'
      - 'web/social-cloud.js'
      - 'web/social-cloud.css'
      - 'web/app.js'
      - 'web/index.html'
      - 'web/vis-nexo-v2.20.css'
      - 'src-tauri/src/**'
      - '.github/workflows/vis-social-check.yml'
  push:
    branches: [main]
    paths:
      - 'services/social/**'
      - 'web/social-cloud.js'
      - 'web/app.js'
      - 'src-tauri/src/**'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check services/social/worker.mjs
      - run: node --check web/social-cloud.js
      - run: node --check web/app.js
      - run: node --test services/social/test_social.mjs
      - run: python3 services/social/test_schema.py
      - name: Install Cloudflare Wrangler for local end-to-end tests
        run: npm install --no-package-lock --ignore-scripts
        working-directory: services/social
      - name: Apply migrations to isolated D1
        run: npx --no-install wrangler d1 migrations apply vis-social-test --local --config wrangler.test.toml --persist-to .wrangler-test
        working-directory: services/social
      - name: Exercise real social API on local Workers runtime
        run: node test_integration.mjs
        working-directory: services/social
      - run: npm ci
      - run: npm run validate

  native:
    name: native Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux Tauri system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf libasound2-dev libudev-dev
      - run: cargo check -p vslauncher-tauri --all-targets --locked
      - run: cargo test --workspace --bins --lib --locked
