name: VIS Social - Cloudflare D1

# This workflow changes production D1 + Durable Objects; deploying MUST be
# explicitly initiated by the maintainer, never by a repository push.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vis-social-production
  cancel-in-progress: false

jobs:
  deploy:
    environment: vis-social-production
    runs-on: ubuntu-24.04
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
      VIS_CEIBO_RESEND_API_KEY: ${{ secrets.VIS_CEIBO_RESEND_API_KEY }}
      VIS_CEIBO_MFA_ENCRYPTION_KEY: ${{ secrets.VIS_CEIBO_MFA_ENCRYPTION_KEY }}
      VIS_CEIBO_FROM_EMAIL: ${{ vars.VIS_CEIBO_FROM_EMAIL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Worker unit tests
        run: |
          node tools/test_social_worker.mjs
          node tools/test_social_peer_key.mjs
      - name: Verify existing Cloudflare deployment credentials
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing CLOUDFLARE_API_TOKEN in GitHub Actions secrets'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID in GitHub Actions secrets/variables'; exit 1; }
      - name: Validate VIS Ceibo Recovery configuration (without logging secrets)
        shell: bash
        run: |
          test -n "$VIS_CEIBO_RESEND_API_KEY" || { echo 'Missing VIS_CEIBO_RESEND_API_KEY'; exit 1; }
          test -n "$VIS_CEIBO_MFA_ENCRYPTION_KEY" || { echo 'Missing VIS_CEIBO_MFA_ENCRYPTION_KEY'; exit 1; }
          test -n "$VIS_CEIBO_FROM_EMAIL" || { echo 'Missing VIS_CEIBO_FROM_EMAIL'; exit 1; }
          node -e "const c=process.env.VIS_CEIBO_MFA_ENCRYPTION_KEY;if(!/^[A-Za-z0-9+/]*={0,2}$/.test(c)||Buffer.from(c,'base64').length!==32)process.exit(1)"
      - name: Apply VIS Social schema to existing D1 database
        working-directory: services/social
        run: npx --yes wrangler@4 d1 migrations apply DB --remote
      - name: Configure VIS Ceibo Recovery secrets in Cloudflare Worker
        shell: bash
        working-directory: services/social
        run: |
          set -euo pipefail
          printf '%s' "$VIS_CEIBO_RESEND_API_KEY" | npx --yes wrangler@4 secret put RESEND_API_KEY
          printf '%s' "$VIS_CEIBO_MFA_ENCRYPTION_KEY" | npx --yes wrangler@4 secret put CEIBO_MFA_ENCRYPTION_KEY
          printf '%s' "$VIS_CEIBO_FROM_EMAIL" | npx --yes wrangler@4 secret put CEIBO_FROM_EMAIL
      - name: Deploy isolated VIS Social Worker
        working-directory: services/social
        run: npx --yes wrangler@4 deploy
      - name: Verify VIS Social production health
        shell: bash
        env:
          VIS_SOCIAL_HEALTH_URL: ${{ vars.VIS_SOCIAL_URL }}
        run: |
          base="${VIS_SOCIAL_HEALTH_URL:-https://vis-social.defreitascarranza-845.workers.dev}"
          for attempt in $(seq 1 15); do
            if curl --fail --silent --show-error "${base%/}/health" > /tmp/vis-social-health.json &&
              node -e "const fs=require('fs');const d=JSON.parse(fs.readFileSync('/tmp/vis-social-health.json','utf8'));if(d.service!=='vis-social'||d.status!=='ready'||d.schema!==12)process.exit(1)"; then
              echo "VIS Social production health: ready, schema 12"
              exit 0
            fi
            # Cloudflare edge rollout can briefly answer with the prior schema.
            echo "Waiting for VIS Social schema 12 propagation (${attempt}/15)"
            sleep 2
          done
          node -e "const fs=require('fs');const d=JSON.parse(fs.readFileSync('/tmp/vis-social-health.json','utf8'));console.error('Health mismatch:',JSON.stringify({service:d.service,status:d.status,schema:d.schema}));"
          exit 1

      - name: Exercise two independent clients over live Cloudflare D1
        env:
          VIS_SOCIAL_TEST_URL: ${{ vars.VIS_SOCIAL_URL }}
        run: node tools/test_social_live.mjs
      - name: Remove temporary CI accounts from remote D1
        if: always()
        working-directory: services/social
        shell: bash
        run: |
          if test -s .vis-ci-live-users.sql; then
            npx --yes wrangler@4 d1 execute DB --remote --file=.vis-ci-live-users.sql
          fi
