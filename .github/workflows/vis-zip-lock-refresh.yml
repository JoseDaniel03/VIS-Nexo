# Read-only helper for migration to patched zip 9.4.x.
# Never has secrets, deploy rights or write permission to the repository.
name: VIS Nexo - ZIP lockfile migration (read-only)
on:
  push:
    branches:
      - security/vis-shield-world-cloud-projects-20261113
    paths:
      - src-tauri/Cargo.toml
      - .github/workflows/vis-zip-lock-refresh.yml
permissions:
  contents: read
jobs:
  lockfile:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Refresh zip crate and required transitive dependencies
        run: |
          cargo metadata --no-deps --format-version 1 >/dev/null
          echo "=== CHECK PATCHED ZIP DEPENDENTS ==="
          cargo tree -i zip@9.4.2
          echo "=== ENSURE VULNERABLE ZIP IS ABSENT ==="
          if cargo tree -i zip@0.6.6 2>/dev/null; then
            echo "Vulnerable legacy ZIP still present" >&2
            exit 1
          fi
          cargo metadata --locked --no-deps --format-version 1 >/dev/null
      - name: Print proposed Cargo.lock in recoverable chunks
        shell: bash
        run: |
          echo "VIS_LOCKFILE_BASE64_BEGIN"
          base64 -w0 Cargo.lock | fold -w 360 | sed 's/^/VIS_LOCK_DATA:/'
          echo "VIS_LOCKFILE_BASE64_END"
